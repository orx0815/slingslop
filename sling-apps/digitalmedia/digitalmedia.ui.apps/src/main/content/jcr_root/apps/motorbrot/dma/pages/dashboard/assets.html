<!--/* Asset list — rendered via selector "assets" on dashboard resource type */-->
<sly data-sly-use.model="org.motorbrot.sling.dma.slingmodels.AssetListModel">

  <sly data-sly-test="${!model.folderFound}">
    <div class="dml-empty-state" style="grid-column: 1 / -1;">
      <p>Folder not found</p>
    </div>
  </sly>

  <sly data-sly-test="${model.folderFound && model.empty}">
    <div class="dml-empty-state" style="grid-column: 1 / -1;">
      <div class="dml-empty-state-icon">📂</div>
      <h3>No assets yet</h3>
      <p>Upload your first asset to get started</p>
    </div>
  </sly>

  <sly data-sly-test="${model.folderFound && !model.empty}">
    <sly data-sly-list.asset="${model.assets}">
      <div class="dml-asset-item" data-asset-id="${asset.path}" data-asset-path="${asset.path}">
        <div class="dml-asset-preview">
          <img src="${asset.previewUrl}" alt="${asset.name}" data-sly-test="${asset.hasPreview}"/>
          <img src="${asset.svgUrl}" alt="${asset.name}" class="dml-svg-preview"
               data-sly-test="${!asset.hasPreview && asset.svg}"/>
          <span class="dml-asset-preview-icon" data-sly-test="${!asset.hasPreview && !asset.svg}">${asset.iconEmoji}</span>
          <span class="dml-asset-type-badge">${asset.fileType}</span>
        </div>
        <div class="dml-asset-info">
          <div class="dml-asset-name" title="${asset.name}">${asset.name}</div>
          <div class="dml-asset-meta">
            <span class="dml-asset-size">${asset.formattedSize}</span>
          </div>
        </div>
      </div>
    </sly>
  </sly>

</sly>
