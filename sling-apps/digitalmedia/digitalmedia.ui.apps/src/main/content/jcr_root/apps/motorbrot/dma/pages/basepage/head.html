<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>${properties.jcr:title @ context='text'} - Digital Media Library</title>

<!--/* Add the .noMinLibs selector (e.g. /content/motorbrot/dml/home.noMinLibs.html) for unminified sources.
       A selector (not a query param) keeps the reverse-proxy cache key clean. */-->
<sly data-sly-test.noMinLibs="${request.requestPathInfo.selectorString == 'noMinLibs'}">
  <script src="/apps/motorbrot/dma/js/htmx.js"></script>
  <script src="/apps/motorbrot/dma/js/public/public-bundle.js"></script>
  <link rel="stylesheet" href="/apps/motorbrot/dma/css/public/public.css" />
</sly>
<sly data-sly-test="${!noMinLibs}">
  <script src="/apps/motorbrot/dma/js/htmx.js"></script>
  <script src="/apps/motorbrot/dma/js/public/public-bundle.min.js"></script>
  <link rel="stylesheet" href="/apps/motorbrot/dma/css/public/public.min.css" />
</sly>
