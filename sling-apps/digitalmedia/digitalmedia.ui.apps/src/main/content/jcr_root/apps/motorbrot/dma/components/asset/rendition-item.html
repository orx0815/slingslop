<sly data-sly-use.model="org.motorbrot.sling.dma.slingmodels.RenditionItemModel">
<div class="dml-rendition-item dml-fade-in">
  <div class="dml-rendition-info">
    <span class="dml-rendition-name">${model.formatName}</span>
    <span class="dml-rendition-dimensions">(${model.width}x${model.height})</span>
  </div>
  <a href="${model.downloadPath}" download class="dml-rendition-download">Download</a>
</div>
</sly>
