<!--/* footer/edit-form-fields.html — modal edit fields for the footer component */-->
<label for="footer-tagline" style="display:block; margin-bottom: 4px; font-size: 0.875em; color: var(--editor-text-muted);">Tagline (below brand name)</label>
<input type="text" id="footer-tagline" name="tagline" class="inline-headline-input"
       value="${properties.tagline @ context='attribute'}"
       placeholder="e.g. // Herding packets since 2049"
       form="editor-form" />
