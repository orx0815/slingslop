<div class="edit-fields-list">
	<div class="edit-fields-group">
		<p><strong>Hero Copy</strong></p>
		<div class="edit-fields-grid">
			<label class="edit-field-row">
				<span class="edit-field-meta">
					<span class="edit-field-label">Eyebrow</span>
					<small class="edit-field-description">Small kicker line shown above the title.</small>
				</span>
				<input type="text" name="eyebrow" value="${properties.eyebrow}" placeholder="Eyebrow" form="editor-form" class="edit-field-input" />
			</label>
			<label class="edit-field-row">
				<span class="edit-field-meta">
					<span class="edit-field-label">Title</span>
					<small class="edit-field-description">The big headline. Keep it punchy.</small>
				</span>
				<input type="text" name="title" value="${properties.title}" placeholder="Title" form="editor-form" class="edit-field-input" />
			</label>
			<label class="edit-field-row">
				<span class="edit-field-meta">
					<span class="edit-field-label">Subtitle</span>
					<small class="edit-field-description">Supporting line under the title.</small>
				</span>
				<input type="text" name="subtitle" value="${properties.subtitle}" placeholder="Subtitle" form="editor-form" class="edit-field-input" />
			</label>
			<label class="edit-field-row">
				<span class="edit-field-meta">
					<span class="edit-field-label">Description</span>
					<small class="edit-field-description">A sentence or two of intro copy.</small>
				</span>
				<input type="text" name="description" value="${properties.description}" placeholder="Description" form="editor-form" class="edit-field-input" />
			</label>
		</div>
	</div>

	<div class="edit-fields-group">
		<p><strong>Primary Call to Action</strong></p>
		<div class="edit-fields-grid">
			<label class="edit-field-row">
				<span class="edit-field-meta">
					<span class="edit-field-label">Label</span>
					<small class="edit-field-description">Button text for the primary action.</small>
				</span>
				<input type="text" name="ctaPrimaryLabel" value="${properties.ctaPrimaryLabel}" placeholder="Label" form="editor-form" class="edit-field-input" />
			</label>
			<label class="edit-field-row">
				<span class="edit-field-meta">
					<span class="edit-field-label">URL</span>
					<small class="edit-field-description">Destination link for the primary button.</small>
				</span>
				<input type="text" name="ctaPrimaryUrl" value="${properties.ctaPrimaryUrl}" placeholder="URL" form="editor-form" class="edit-field-input" />
			</label>
		</div>
	</div>

	<div class="edit-fields-group">
		<p><strong>Secondary Call to Action</strong></p>
		<div class="edit-fields-grid">
			<label class="edit-field-row">
				<span class="edit-field-meta">
					<span class="edit-field-label">Label</span>
					<small class="edit-field-description">Button text for the secondary action.</small>
				</span>
				<input type="text" name="ctaSecondaryLabel" value="${properties.ctaSecondaryLabel}" placeholder="Label" form="editor-form" class="edit-field-input" />
			</label>
			<label class="edit-field-row">
				<span class="edit-field-meta">
					<span class="edit-field-label">URL</span>
					<small class="edit-field-description">Destination link for the secondary button.</small>
				</span>
				<input type="text" name="ctaSecondaryUrl" value="${properties.ctaSecondaryUrl}" placeholder="URL" form="editor-form" class="edit-field-input" />
			</label>
		</div>
	</div>
</div>
