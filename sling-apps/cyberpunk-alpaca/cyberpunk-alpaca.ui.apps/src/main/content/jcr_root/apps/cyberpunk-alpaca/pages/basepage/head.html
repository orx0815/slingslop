<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>${properties.jcr:title || 'Cyberpunk Alpaca'}</title>
<meta name="description" content="${properties.jcr:description}" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;600;700&display=swap">

<!--/*  Add the .noMinLibs selector (e.g. /cyberpunk-alpaca/home.noMinLibs.html) for
        unminified sources. A selector (not a query param) keeps the reverse-proxy
        cache key clean. */-->
<sly data-sly-test.noMinLibs="${request.requestPathInfo.selectorString == 'noMinLibs'}">

  <!-- Public bundle (unminified) -->
  <script src="/apps/cyberpunk-alpaca/js/public/public-bundle.js"></script>
  <link rel="stylesheet" href="/apps/cyberpunk-alpaca/css/public/public.css" />

  <!-- Editor bundle (unminified) — only for logged-in users -->
  <sly data-sly-use.auth="org.motorbrot.cyberpunkalpaca.slingmodels.UserIsLoggedIn"
       data-sly-test="${auth.loggedIn}">
    <script src="/apps/cyberpunk-alpaca/js/htmx.js"></script>
    <script src="/apps/cyberpunk-alpaca/js/editor/editor-bundle.js"></script>
    <link rel="stylesheet" href="/apps/cyberpunk-alpaca/css/editor/editor.css" />
  </sly>

</sly>
<sly data-sly-test="${!noMinLibs}">

  <!-- Public bundle (minified) -->
  <script src="/apps/cyberpunk-alpaca/js/public/public-bundle.min.js"></script>
  <link rel="stylesheet" href="/apps/cyberpunk-alpaca/css/public/public.min.css" />

  <!-- Editor bundle (minified, htmx inlined) — only for logged-in users -->
  <sly data-sly-use.auth="org.motorbrot.cyberpunkalpaca.slingmodels.UserIsLoggedIn"
       data-sly-test="${auth.loggedIn}">
    <script src="/apps/cyberpunk-alpaca/js/editor/editor-bundle.min.js"></script>
    <link rel="stylesheet" href="/apps/cyberpunk-alpaca/css/editor/editor.min.css" />
  </sly>

</sly>
