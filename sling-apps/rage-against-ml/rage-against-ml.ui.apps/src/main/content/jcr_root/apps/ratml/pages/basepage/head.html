<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>${properties.jcr:title @ context='text'}</title>

<!--/* Add the .noMinLibs selector (e.g. /content/ratml/home.noMinLibs.html) for unminified sources.
       A selector (not a query param) keeps the reverse-proxy cache key clean. */-->
<sly data-sly-test.noMinLibs="${request.requestPathInfo.selectorString == 'noMinLibs'}">

  <!-- Public bundle (unminified) -->
  <script src="/apps/ratml/js/public/public-bundle.js"></script>
  <link rel="stylesheet" href="/apps/ratml/css/public/public.css" />

  <!-- Editor bundle (unminified) — only for logged-in users -->
  <sly data-sly-use.auth="org.motorbrot.ratml.slingmodels.UserIsLoggedIn"
       data-sly-test="${auth.loggedIn}">
    <script src="/apps/ratml/js/htmx.js"></script>
    <script src="/apps/ratml/js/editor/editor-bundle.js"></script>
    <link rel="stylesheet" href="/apps/ratml/css/editor/editor.css" />
  </sly>

</sly>
<sly data-sly-test="${!noMinLibs}">

  <!-- Public bundle (minified) -->
  <script src="/apps/ratml/js/public/public-bundle.min.js"></script>
  <link rel="stylesheet" href="/apps/ratml/css/public/public.min.css" />

  <!-- Editor bundle (minified, htmx inlined) — only for logged-in users -->
  <sly data-sly-use.auth="org.motorbrot.ratml.slingmodels.UserIsLoggedIn"
       data-sly-test="${auth.loggedIn}">
    <script src="/apps/ratml/js/editor/editor-bundle.min.js"></script>
    <link rel="stylesheet" href="/apps/ratml/css/editor/editor.min.css" />
  </sly>

</sly>
