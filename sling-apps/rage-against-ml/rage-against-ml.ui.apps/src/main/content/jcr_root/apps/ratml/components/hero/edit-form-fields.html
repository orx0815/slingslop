<div class="edit-fields-list">
  <div class="edit-fields-group">
    <div class="edit-fields-grid">
      <label class="edit-field-row">
        <span class="edit-field-meta">
          <span class="edit-field-label">Eyebrow</span>
          <small class="edit-field-description">Small stamped label above the title.</small>
        </span>
        <input type="text" name="eyebrow" value="${properties.eyebrow}"
               class="edit-field-input" placeholder="Eyebrow" form="editor-form" />
      </label>
      <label class="edit-field-row">
        <span class="edit-field-meta">
          <span class="edit-field-label">Title</span>
          <small class="edit-field-description">Main headline, shouted in display type.</small>
        </span>
        <input type="text" name="title" value="${properties.title}"
               class="edit-field-input" placeholder="Title" form="editor-form" />
      </label>
      <label class="edit-field-row">
        <span class="edit-field-meta">
          <span class="edit-field-label">Subtitle</span>
          <small class="edit-field-description">Tagline below the title.</small>
        </span>
        <input type="text" name="subtitle" value="${properties.subtitle}"
               class="edit-field-input" placeholder="Subtitle" form="editor-form" />
      </label>
      <label class="edit-field-row">
        <span class="edit-field-meta">
          <span class="edit-field-label">Description</span>
          <small class="edit-field-description">Short supporting paragraph.</small>
        </span>
        <input type="text" name="description" value="${properties.description}"
               class="edit-field-input" placeholder="Description" form="editor-form" />
      </label>
      <label class="edit-field-row">
        <span class="edit-field-meta">
          <span class="edit-field-label">CTA Label</span>
          <small class="edit-field-description">Button text; leave empty to hide the button.</small>
        </span>
        <input type="text" name="ctaLabel" value="${properties.ctaLabel}"
               class="edit-field-input" placeholder="CTA label" form="editor-form" />
      </label>
      <label class="edit-field-row">
        <span class="edit-field-meta">
          <span class="edit-field-label">CTA URL</span>
          <small class="edit-field-description">Absolute (https://...) or relative (/path/page.html) URL.</small>
        </span>
        <input type="text" name="ctaUrl" value="${properties.ctaUrl}"
               class="edit-field-input" placeholder="/content/ratml/home/manifesto.html" form="editor-form" />
      </label>
    </div>
  </div>
</div>
