<div class="edit-fields-list">
  <div class="edit-fields-group">
    <div class="edit-fields-grid">
      <label class="edit-field-row">
        <span class="edit-field-meta">
          <span class="edit-field-label">Quote</span>
          <small class="edit-field-description">The shouted line. Quotation marks are added by CSS.</small>
        </span>
        <input type="text" name="quote" value="${properties.quote}"
               class="edit-field-input" placeholder="Quote" form="editor-form" />
      </label>
      <label class="edit-field-row">
        <span class="edit-field-meta">
          <span class="edit-field-label">Attribution</span>
          <small class="edit-field-description">Who said it; leave empty to hide.</small>
        </span>
        <input type="text" name="attribution" value="${properties.attribution}"
               class="edit-field-input" placeholder="Attribution" form="editor-form" />
      </label>
    </div>
  </div>
</div>
