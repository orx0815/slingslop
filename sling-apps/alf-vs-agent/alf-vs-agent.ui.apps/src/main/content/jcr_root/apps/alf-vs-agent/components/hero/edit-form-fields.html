<!--/* hero/edit-form-fields.html — Edit form fields for hero component */-->
<div class="edit-form__field">
  <label for="headline-field">Headline</label>
  <input type="text" id="headline-field" name=".:headline" value="${properties.headline @ context='attribute'}" />
</div>

<div class="edit-form__field">
  <label for="subtitle-field">Subtitle</label>
  <input type="text" id="subtitle-field" name=".:subtitle" value="${properties.subtitle @ context='attribute'}" />
</div>

<div class="edit-form__field">
  <label for="ctaText-field">CTA Text</label>
  <input type="text" id="ctaText-field" name=".:ctaText" value="${properties.ctaText @ context='attribute'}" />
</div>

<div class="edit-form__field">
  <label for="ctaLink-field">CTA Link</label>
  <input type="text" id="ctaLink-field" name=".:ctaLink" value="${properties.ctaLink @ context='attribute'}" />
</div>
