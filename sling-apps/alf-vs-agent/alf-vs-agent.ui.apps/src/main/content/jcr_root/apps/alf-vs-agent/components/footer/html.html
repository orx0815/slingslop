<!--/* footer/html.html — Footer component view */-->
<footer class="site-footer"
        data-sly-use.auth="org.motorbrot.alfvsagent.slingmodels.UserIsLoggedIn"
        data-sly-set.editPath="${resource.path}.edit-form.html"
        data-zen-editable="true"
        data-sly-attribute.hx-get="${auth.loggedIn ? editPath : false}"
        data-sly-attribute.hx-trigger="${auth.loggedIn ? 'click' : false}"
        data-sly-attribute.hx-swap="${auth.loggedIn ? 'outerMorph' : false}">
  <div class="container">
    <div class="site-footer__inner">
      <p class="site-footer__brand">${properties.copyright @ context='text'}</p>
      <ul class="site-footer__links">
        <li><a href="/content/alf-vs-agent/home.html">Home</a></li>
        <li><a href="/content/alf-vs-agent/styleguide.html">Style Guide</a></li>
      </ul>
    </div>
  </div>
</footer>
