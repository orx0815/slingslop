<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>${properties.jcr:title @ context='text'} — Sling Bench</title>

<!--/*  Add the .noMinLibs selector (e.g. /content/sling-bench/home.noMinLibs.html) for
        unminified sources. A selector (not a query param) keeps the reverse-proxy cache
        key clean. */-->
<sly data-sly-test.noMinLibs="${request.requestPathInfo.selectorString == 'noMinLibs'}">

  <!-- Public bundle (unminified) -->
  <script src="/apps/sling-bench/js/public/public-bundle.js"></script>
  <link rel="stylesheet" href="/apps/sling-bench/css/public/public.css" />

  <!-- Editor bundle (unminified) — only for logged-in users -->
  <sly data-sly-use.auth="org.motorbrot.slingbench.slingmodels.UserIsLoggedIn"
       data-sly-test="${auth.loggedIn}">
    <script src="/apps/sling-bench/js/htmx.js"></script>
    <script src="/apps/sling-bench/js/editor/editor-bundle.js"></script>
    <link rel="stylesheet" href="/apps/sling-bench/css/editor/editor.css" />
  </sly>

</sly>
<sly data-sly-test="${!noMinLibs}">

  <!-- Public bundle (minified, cache-busted via versioned clientlib URL) -->
  <script src="/apps/sling-bench/js/public/public-bundle.min.js"></script>
  <link rel="stylesheet" href="/apps/sling-bench/css/public/public.min.css" />

  <sly data-sly-use.auth="org.motorbrot.slingbench.slingmodels.UserIsLoggedIn"
       data-sly-test="${auth.loggedIn}">
    <script src="/apps/sling-bench/js/htmx.js"></script>
    <script src="/apps/sling-bench/js/editor/editor-bundle.min.js"></script>
    <link rel="stylesheet" href="/apps/sling-bench/css/editor/editor.min.css" />
  </sly>

</sly>
