<!--/* Hero 3D — Three.js loaded only on homepage */-->
<sly data-sly-test.noMinLibs="${request.requestPathInfo.selectorString == 'noMinLibs'}">
  <script src="/apps/sling-matrix/js/public/hero3d-bundle.js"></script>
</sly>
<sly data-sly-test="${!noMinLibs}">
  <sly data-sly-use.hero3d="${'org.motorbrot.slingmatrix.slingmodels.ClientlibUrl' @ path='/apps/sling-matrix/js/public/hero3d-bundle.min.js'}">
    <script src="${hero3d.href}"></script>
  </sly>
</sly>

<section class="hero-section">
  <sly data-sly-resource="${'./hero' @ resourceType='sling-matrix/components/hero'}" />
</section>
