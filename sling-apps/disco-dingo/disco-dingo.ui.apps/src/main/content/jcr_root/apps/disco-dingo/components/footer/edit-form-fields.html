<div class="edit-fields-list">
	<div class="edit-fields-group">
		<p><strong>Brand</strong></p>
		<div class="edit-fields-grid">
			<label class="edit-field-row">
				<span class="edit-field-meta">
					<span class="edit-field-label">Blurb</span>
					<small class="edit-field-description">Short sentence shown under the Disco Dingo logo in the footer.</small>
				</span>
				<input type="text" name="blurb" value="${properties.blurb}" placeholder="Blurb" form="editor-form" class="edit-field-input" />
			</label>
			<label class="edit-field-row">
				<span class="edit-field-meta">
					<span class="edit-field-label">Copyright</span>
				</span>
				<input type="text" name="copyright" value="${properties.copyright}" placeholder="© 2026 Disco Dingo" form="editor-form" class="edit-field-input" />
			</label>
		</div>
	</div>

	<div class="edit-fields-group">
		<p><strong>Visit Links</strong></p>
		<div class="edit-fields-grid">
			<label class="edit-field-row">
				<span class="edit-field-meta"><span class="edit-field-label">Link 1 Text</span></span>
				<input type="text" name="link1Text" value="${properties.link1Text}" form="editor-form" class="edit-field-input" />
			</label>
			<label class="edit-field-row">
				<span class="edit-field-meta"><span class="edit-field-label">Link 1 URL</span></span>
				<input type="url" name="link1Href" value="${properties.link1Href}" form="editor-form" class="edit-field-input" />
			</label>
			<label class="edit-field-row">
				<span class="edit-field-meta"><span class="edit-field-label">Link 2 Text</span></span>
				<input type="text" name="link2Text" value="${properties.link2Text}" form="editor-form" class="edit-field-input" />
			</label>
			<label class="edit-field-row">
				<span class="edit-field-meta"><span class="edit-field-label">Link 2 URL</span></span>
				<input type="url" name="link2Href" value="${properties.link2Href}" form="editor-form" class="edit-field-input" />
			</label>
		</div>
	</div>

	<div class="edit-fields-group">
		<p><strong>Follow Links</strong></p>
		<div class="edit-fields-grid">
			<label class="edit-field-row">
				<span class="edit-field-meta"><span class="edit-field-label">Link 3 Text</span></span>
				<input type="text" name="link3Text" value="${properties.link3Text}" form="editor-form" class="edit-field-input" />
			</label>
			<label class="edit-field-row">
				<span class="edit-field-meta"><span class="edit-field-label">Link 3 URL</span></span>
				<input type="url" name="link3Href" value="${properties.link3Href}" form="editor-form" class="edit-field-input" />
			</label>
			<label class="edit-field-row">
				<span class="edit-field-meta"><span class="edit-field-label">Link 4 Text</span></span>
				<input type="text" name="link4Text" value="${properties.link4Text}" form="editor-form" class="edit-field-input" />
			</label>
			<label class="edit-field-row">
				<span class="edit-field-meta"><span class="edit-field-label">Link 4 URL</span></span>
				<input type="url" name="link4Href" value="${properties.link4Href}" form="editor-form" class="edit-field-input" />
			</label>
		</div>
	</div>
</div>
