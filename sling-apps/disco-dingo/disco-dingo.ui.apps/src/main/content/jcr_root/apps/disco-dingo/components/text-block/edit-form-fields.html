<div class="edit-fields-list">
	<div class="edit-fields-group">
		<div class="edit-fields-grid">
			<label class="edit-field-row">
				<span class="edit-field-meta">
					<span class="edit-field-label">Eyebrow</span>
					<small class="edit-field-description">Optional small label shown above the headline.</small>
				</span>
				<input type="text" name="eyebrow" value="${properties.eyebrow}" placeholder="Eyebrow" form="editor-form" class="edit-field-input" />
			</label>
			<label class="edit-field-row">
				<span class="edit-field-meta">
					<span class="edit-field-label">Headline</span>
					<small class="edit-field-description">Optional heading shown above the rich text content.</small>
				</span>
				<input type="text" name="headline" value="${properties.headline}" placeholder="Headline" form="editor-form" class="edit-field-input" />
			</label>
		</div>
	</div>
</div>

<!--/* Hidden textarea: carries initial HTML from Sling; read by editor-bundle.js on init */-->
<textarea id="content-editor" style="display:none;">${properties.text @ context='html'}</textarea>
<!--/* Hidden input populated with editor HTML before htmx submit */-->
<input type="hidden" id="content-hidden" name="text" form="editor-form" />
