<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>${properties.jcr:title} — Disco Dingo</title>
<meta name="description" content="${properties.jcr:description ? properties.jcr:description : 'Disco Dingo — where every night is a dance party.'}">

<!--/* Add the .noMinLibs selector (e.g. /disco-dingo/home.noMinLibs.html) for unminified sources.
       A selector (not a query param) keeps the reverse-proxy cache key clean. */-->
<sly data-sly-test.noMinLibs="${request.requestPathInfo.selectorString == 'noMinLibs'}">

  <!-- Public bundle (unminified) -->
  <script src="/apps/disco-dingo/js/public/public-bundle.js"></script>
  <link rel="stylesheet" href="/apps/disco-dingo/css/public/public.css" />

  <!-- Editor bundle (unminified) — only for logged-in users -->
  <sly data-sly-use.auth="org.discodingo.discodingo.slingmodels.UserIsLoggedIn"
       data-sly-test="${auth.loggedIn}">
    <!-- htmx for hypermedia interactions -->
    <script src="/apps/disco-dingo/js/htmx.js"></script>
    <script src="/apps/disco-dingo/js/editor/editor-bundle.js"></script>
    <link rel="stylesheet" href="/apps/disco-dingo/css/editor/editor.css" />
  </sly>

</sly>
<sly data-sly-test="${!noMinLibs}">

  <!-- Public bundle (minified) -->
  <script src="/apps/disco-dingo/js/public/public-bundle.min.js"></script>
  <link rel="stylesheet" href="/apps/disco-dingo/css/public/public.min.css" />

  <!-- Editor bundle (minified, htmx inlined) — only for logged-in users -->
  <sly data-sly-use.auth="org.discodingo.discodingo.slingmodels.UserIsLoggedIn"
       data-sly-test="${auth.loggedIn}">
    <script src="/apps/disco-dingo/js/editor/editor-bundle.min.js"></script>
    <link rel="stylesheet" href="/apps/disco-dingo/css/editor/editor.min.css" />
  </sly>

</sly>
