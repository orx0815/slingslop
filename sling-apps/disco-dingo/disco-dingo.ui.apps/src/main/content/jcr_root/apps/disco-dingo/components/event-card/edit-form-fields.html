<div class="edit-fields-list">
	<div class="edit-fields-group">
		<div class="edit-fields-grid">
			<label class="edit-field-row">
				<span class="edit-field-meta"><span class="edit-field-label">Day Label</span><small class="edit-field-description">e.g. "Sat"</small></span>
				<input type="text" name="dateDay" value="${properties.dateDay}" form="editor-form" class="edit-field-input" />
			</label>
			<label class="edit-field-row">
				<span class="edit-field-meta"><span class="edit-field-label">Date Number</span><small class="edit-field-description">e.g. "27"</small></span>
				<input type="text" name="dateNumber" value="${properties.dateNumber}" form="editor-form" class="edit-field-input" />
			</label>
			<label class="edit-field-row">
				<span class="edit-field-meta"><span class="edit-field-label">Badge</span><small class="edit-field-description">Optional, e.g. "Sold Out"</small></span>
				<input type="text" name="badge" value="${properties.badge}" form="editor-form" class="edit-field-input" />
			</label>
			<label class="edit-field-row">
				<span class="edit-field-meta"><span class="edit-field-label">Title</span></span>
				<input type="text" name="title" value="${properties.title}" form="editor-form" class="edit-field-input" />
			</label>
			<label class="edit-field-row">
				<span class="edit-field-meta"><span class="edit-field-label">Description</span></span>
				<input type="text" name="description" value="${properties.description}" form="editor-form" class="edit-field-input" />
			</label>
		</div>
	</div>
</div>
