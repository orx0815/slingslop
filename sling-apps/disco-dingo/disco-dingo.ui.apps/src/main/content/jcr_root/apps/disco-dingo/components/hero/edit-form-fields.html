<div class="edit-fields-list">
	<div class="edit-fields-group">
		<div class="edit-fields-grid">
			<label class="edit-field-row">
				<span class="edit-field-meta">
					<span class="edit-field-label">Eyebrow</span>
					<small class="edit-field-description">Small label shown above the headline.</small>
				</span>
				<input type="text" name="eyebrow" value="${properties.eyebrow}" placeholder="Eyebrow" form="editor-form" class="edit-field-input" />
			</label>
			<label class="edit-field-row">
				<span class="edit-field-meta">
					<span class="edit-field-label">Headline</span>
					<small class="edit-field-description">The big gradient headline.</small>
				</span>
				<input type="text" name="headline" value="${properties.headline}" placeholder="Headline" form="editor-form" class="edit-field-input" />
			</label>
			<label class="edit-field-row">
				<span class="edit-field-meta">
					<span class="edit-field-label">Subheadline</span>
					<small class="edit-field-description">Supporting sentence shown below the headline.</small>
				</span>
				<input type="text" name="subheadline" value="${properties.subheadline}" placeholder="Subheadline" form="editor-form" class="edit-field-input" />
			</label>
			<label class="edit-field-row">
				<span class="edit-field-meta">
					<span class="edit-field-label">Primary Button Text</span>
				</span>
				<input type="text" name="ctaText" value="${properties.ctaText}" placeholder="Button text" form="editor-form" class="edit-field-input" />
			</label>
			<label class="edit-field-row">
				<span class="edit-field-meta">
					<span class="edit-field-label">Primary Button Link</span>
				</span>
				<input type="url" name="ctaLink" value="${properties.ctaLink}" placeholder="https://…" form="editor-form" class="edit-field-input" />
			</label>
			<label class="edit-field-row">
				<span class="edit-field-meta">
					<span class="edit-field-label">Secondary Button Text</span>
				</span>
				<input type="text" name="secondaryCtaText" value="${properties.secondaryCtaText}" placeholder="Button text" form="editor-form" class="edit-field-input" />
			</label>
			<label class="edit-field-row">
				<span class="edit-field-meta">
					<span class="edit-field-label">Secondary Button Link</span>
				</span>
				<input type="url" name="secondaryCtaLink" value="${properties.secondaryCtaLink}" placeholder="https://…" form="editor-form" class="edit-field-input" />
			</label>
		</div>
	</div>
</div>
