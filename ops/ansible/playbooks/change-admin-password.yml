---
# Rotate the Sling admin password to vault_sling_admin_password.
# Idempotent: if the target password already works, no change is made.
#
#   ansible-playbook -i inventory/hosts.yml playbooks/change-admin-password.yml --ask-vault-pass

- hosts: slingslop
  gather_facts: false
  become: true

  tasks:
    - name: Include slingslop role's rotate-password task list
      ansible.builtin.include_role:
        name: slingslop
        tasks_from: rotate-password
