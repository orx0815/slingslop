---
# Pull a newer webcache image and restart only that container.
#
#   ansible-playbook -i inventory/hosts.yml playbooks/update-webcache.yml --ask-vault-pass
#
# CI passes the exact image built from the pushed commit, e.g.:
#   -e webcache_image=ghcr.io/orx0815/slingslop-webcache:sha-<sha>
# The edge compose is re-rendered so webcache switches to it; only the webcache
# service is recreated, so Traefik keeps proxying and the disk cache survives.

- hosts: slingslop
  gather_facts: true
  become: true

  tasks:
    - name: Re-render edge compose with the target webcache_image
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/traefik/templates/compose.edge.yml.j2"
        dest: "{{ slingslop_root }}/compose.edge.yml"
        owner: root
        group: root
        mode: "0640"

    - name: Pull webcache image
      ansible.builtin.command:
        cmd: "{{ slingslop_root }}/dc pull webcache"
      register: pull_result
      changed_when: "'Downloaded newer image' in pull_result.stdout or 'Pull complete' in pull_result.stdout"

    - name: Recreate webcache container (no-deps)
      ansible.builtin.command:
        cmd: "{{ slingslop_root }}/dc up -d --no-deps webcache"
      register: up_result
      changed_when: "'Started' in up_result.stderr or 'Recreated' in up_result.stderr or 'Created' in up_result.stderr"

    - name: Verify webcache responds inside the network
      ansible.builtin.command:
        cmd: docker exec slingslop-webcache curl -sf -o /dev/null -w '%{http_code}\n' http://127.0.0.1/
      register: probe
      retries: 20
      delay: 3
      until: probe.rc == 0
      changed_when: false
