---
- name: Install hardening packages
  ansible.builtin.apt:
    name:
      - fail2ban
      - openssh-server
    state: present

- name: Install auditd (optional)
  ansible.builtin.apt:
    name: auditd
    state: present
  when: enable_auditd | default(false) | bool

- name: Deploy sysctl hardening
  ansible.builtin.copy:
    src: 99-hardening.conf
    dest: /etc/sysctl.d/99-hardening.conf
    owner: root
    group: root
    mode: "0644"
  notify: reload sysctl

- name: Deploy sshd_config
  ansible.builtin.template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: "0600"
    validate: "/usr/sbin/sshd -t -f %s"
  notify: restart ssh

- name: Configure unattended-upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";

- name: Configure fail2ban sshd jail
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/sshd.local
    owner: root
    group: root
    mode: "0644"
    content: |
      [sshd]
      enabled  = true
      port     = {{ ssh_port }}
      maxretry = 3
      findtime = 10m
      bantime  = 1h
  notify: restart fail2ban

- name: Drop Traefik basicAuth fail2ban filter
  ansible.builtin.copy:
    src: traefik-basicauth.filter
    dest: /etc/fail2ban/filter.d/traefik-basicauth.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart fail2ban

- name: Configure Traefik basicAuth fail2ban jail
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/traefik-basicauth.local
    owner: root
    group: root
    mode: "0644"
    content: |
      [traefik-basicauth]
      enabled  = true
      filter   = traefik-basicauth
      logpath  = {{ slingslop_root }}/data/traefik/access.log
      maxretry = 5
      findtime = 10m
      bantime  = 1h
      port     = http,https
  notify: restart fail2ban
