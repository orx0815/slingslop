---
- name: Render slingslop env file
  ansible.builtin.copy:
    dest: "{{ slingslop_secrets_dir }}/slingslop.env"
    owner: root
    group: root
    mode: "0600"
    content: |
      # Managed by Ansible
      EXTRA_JAVA_OPTS=-Xmx{{ slingslop_java_heap_max }} -Dsling.run.modes=oak_tar,prod

- name: Render app compose file
  ansible.builtin.template:
    src: compose.app.yml.j2
    dest: "{{ slingslop_root }}/compose.app.yml"
    owner: root
    group: root
    mode: "0640"

# Local test path: ship a locally-built image (containing freshly-added apps)
# into the host instead of pulling from a registry.
- name: Load locally-built slingslop image tarball
  when: slingslop_image_load_tar | default('') | length > 0
  block:
    - name: Copy image tarball to host
      ansible.builtin.copy:
        src: "{{ slingslop_image_load_tar }}"
        dest: /tmp/slingslop-image.tar
        mode: "0644"
    - name: docker load the image
      ansible.builtin.command:
        cmd: "docker load -i /tmp/slingslop-image.tar"
      register: img_load
      changed_when: "'Loaded image' in img_load.stdout"
    - name: Remove the tarball
      ansible.builtin.file:
        path: /tmp/slingslop-image.tar
        state: absent

- name: Pull slingslop image
  community.docker.docker_image:
    name: "{{ slingslop_image }}"
    source: pull
    force_source: false
  when: slingslop_image_pull | default(true) | bool

- name: Bring up slingslop container
  ansible.builtin.command:
    cmd: "{{ slingslop_root }}/dc up -d --no-deps slingslop"
  register: app_up
  changed_when: "'Started' in app_up.stderr or 'Recreated' in app_up.stderr or 'Created' in app_up.stderr"

- name: Wait for Sling to respond
  ansible.builtin.uri:
    url: "{{ sling_internal_url }}/starter.html"
    status_code: [200, 401, 302]
    timeout: 5
  register: health
  until: health.status in [200, 401, 302]
  retries: 60
  delay: 5

- name: Rotate Sling admin password
  ansible.builtin.include_tasks: rotate-password.yml

# Deploy-time short-URL mapping — install the CONGA /etc/map package into the
# running Sling (see install-mappings.yml). Extracted so the GitOps edge-config
# deploy can reuse it standalone.
- name: Install CONGA /etc/map short-URL mappings package
  ansible.builtin.include_tasks: install-mappings.yml
  tags: [slingmappings]
