---
- name: Render admin-password rotation script
  ansible.builtin.template:
    src: change-admin-password.sh.j2
    dest: "{{ slingslop_root }}/change-admin-password.sh"
    owner: root
    group: root
    mode: "0700"

- name: Rotate Sling admin password if needed
  ansible.builtin.command:
    cmd: "{{ slingslop_root }}/change-admin-password.sh"
  register: rotation
  changed_when: "'CHANGED' in rotation.stdout"
  failed_when: rotation.rc != 0
