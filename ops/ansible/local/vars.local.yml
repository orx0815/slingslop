---
# ---------------------------------------------------------------------------
# Local-test overrides + throwaway "secrets".
#
# Passed to ansible-playbook via `-e @local/vars.local.yml` by test-local.sh,
# on top of `-e @inventory/group_vars/all/main.yml`. Extra-vars win, so these
# override the committed production defaults WITHOUT needing an encrypted
# vault.yml. NONE of these values are real secrets — they exist only to make a
# throwaway VM converge. Never reuse them anywhere public.
# ---------------------------------------------------------------------------

# --- Local domain (mapped to the VM IP via /etc/hosts, see test-local.sh) ---
domain: slingslop.local

# --- The whole point of the local harness: no Let's Encrypt on a private VM.
# Traefik serves its built-in self-signed cert; browsers will warn (expected).
traefik_acme_enabled: false

# --- Keep Vagrant's own `vagrant` user able to SSH in after sshd hardening,
# so `vagrant ssh` / `vagrant reload` keep working alongside `deploy`.
ssh_allowed_users:
  - "{{ deploy_user }}"
  - vagrant

# --- deploy user's public key: generated by test-local.sh into local/.ssh/.
# Read from disk on the control node at runtime (no manual copy/paste).
vault_ssh_admin_pubkey: "{{ lookup('file', playbook_dir + '/../local/.ssh/deploy_ed25519.pub') }}"

# --- Throwaway credentials -------------------------------------------------
vault_sling_admin_password: "admin"
vault_grafana_admin_password: "admin"
vault_acme_email: "local@slingslop.local"   # unused when traefik_acme_enabled=false

# The basicAuth htpasswd values (editor / grafana / dashboard) are generated
# fresh by test-local.sh into local/.runtime/secrets.local.yml (user+password
# both "localtest") and layered on top of this file — so they are always valid
# for the current run rather than a stale committed hash.
# basicAuth login for editor/grafana/dashboard is localtest / localtest

# Public GHCR images → anonymous pull, no token needed.
vault_ghcr_pull_user: ""
vault_ghcr_pull_token: ""
