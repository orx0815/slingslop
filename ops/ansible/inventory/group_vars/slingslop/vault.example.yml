---
# ===========================================================================
# REAL production secrets live here — NOT in group_vars/all/vault.yml.
#
# Why this path:
#   * `group_vars/slingslop/` is scoped to the inventory group `slingslop`
#     (its only member is the `slingslop-prod` host), so these values override
#     the demo defaults in group_vars/all for the real host.
#   * `main` and feature branches have NEVER contained this path. Git merges
#     only reconcile files that exist in the incoming history, so a PR merged
#     from `main` (e.g. an Agent Smith app PR) into `deploy/motorbrot_prod`
#     CANNOT modify or delete this file. That removes the "public demo vault
#     clobbers the real vault on merge" failure mode entirely. The old design
#     kept the real and demo vaults at the SAME path (group_vars/all/vault.yml)
#     on different branches, which is exactly what a merge clobbers.
#
# How it is used:
#   * On `deploy/motorbrot_prod` only: copy this file to `vault.yml` in the same
#     directory, fill it in, then encrypt it with the REAL passphrase:
#         ansible-vault encrypt ops/ansible/inventory/group_vars/slingslop/vault.yml
#     (the passphrase is the private `ANSIBLE_VAULT_PASSWORD` GitHub secret).
#   * `main` never gets a real `vault.yml` here — only this `.example.yml`.
#   * The deploy uses the single existing ANSIBLE_VAULT_PASSWORD secret — no new
#     GitHub secret configuration is required.
#
# Helpers to compute htpasswd values:
#   htpasswd -nbB admin '<password>'          # local (apt install apache2-utils)
#   docker run --rm httpd:2.4 htpasswd -nbB admin '<password>'   # no local install
# ===========================================================================

# Sling admin user password (replaces the default `admin/admin`).
vault_sling_admin_password: "ChangeMe-SlingAdmin-Long-Random"

# Public key (Ed25519 preferred) installed into deploy user's authorized_keys.
vault_ssh_admin_pubkey: |
  ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx you@laptop

# Let's Encrypt account email
vault_acme_email: ops@example.org

# Traefik dashboard basicAuth (user:$apr1$SALT$HASH).
vault_traefik_dashboard_htpasswd: "admin:$apr1$SALT$HASH"

# basicAuth gate in front of editor.<domain>. One htpasswd line per user.
vault_editor_basicauth_users_htpasswd: |
  editor:$apr1$SALT$HASH

# basicAuth gate in front of grafana.<domain> / logs.<domain>.
vault_grafana_basicauth_users_htpasswd: |
  ops:$apr1$SALT$HASH

# Grafana built-in admin (used for the first login + provisioning API).
vault_grafana_admin_password: "ChangeMe-Grafana-Long-Random"

# OPTIONAL — GHCR pull credentials for private images. Leave empty for public.
vault_ghcr_pull_user: ""
vault_ghcr_pull_token: ""
