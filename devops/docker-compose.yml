services:
  slingslop:
    # Default: single-store image. Everything (incl. /apps, /libs) lives in
    # the slingslop-volume.
    #
    # To run the composite-NodeStore variant instead (/apps and /libs come
    # from a read-only segment store baked into the image; only mutable
    # content sits in the volume) swap the image tag below for the
    # '-composite' one and rebuild it once with:
    #     cd ../launcher && mvn install -Ddocker.skip=false -Pcomposite-image
    #
    # image: ghcr.io/orx0815/slingslop:snapshot-composite
    image: ghcr.io/orx0815/slingslop:snapshot
    build:
      context: ../launcher
    ports:
      - "8080:8080"
    volumes:
      - slingslop-volume:/opt/sling/launcher
  webcache:
    image: ghcr.io/orx0815/slingslop-webcache:latest
    environment:
      RENDERER_URL: 172.17.0.1
    build:
      context: webcache
    ports:
      - "80:80"
    volumes:
      - slingslop-volume:/opt/sling/launcher
      # zengarden + www (sling-matrix) vhosts are CONGA-generated (single source
      # of truth shared with prod). Generate first:
      # mvn -pl devops/conga -am -DskipTests clean package (env: local-webcache)
      # create_host_path: false -> fails loudly if you forgot to generate,
      # instead of silently bind-mounting an empty directory over the vhost.
      - type: bind
        source: conga/target/configuration/local-webcache/localhost/webcache/zengarden.conf
        target: /etc/apache2/sites-enabled/zengarden.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: conga/target/configuration/local-webcache/localhost/webcache/sling-matrix.conf
        target: /etc/apache2/sites-enabled/www.conf
        read_only: true
        bind:
          create_host_path: false
volumes:
  slingslop-volume:
