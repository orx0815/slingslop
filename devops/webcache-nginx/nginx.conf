worker_processes auto;
error_log /dev/stderr warn;
events { worker_connections 1024; }

# nginx workers only inherit a small fixed set of env vars (PATH, TZ, ...) by
# default — without this, os.getenv("FLUSH_TOKEN") in the /flush handler below
# always sees nil even when the container env var IS set (compose.edge.yml.j2).
env FLUSH_TOKEN;

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile on;
    tcp_nopush on;
    server_tokens off;
    keepalive_timeout 65;

    log_format cache '$remote_addr $status $upstream_cache_status "$request"';
    access_log /dev/stdout cache;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Per-tenant CONGA-generated server blocks (proxy_cache_path + server{}) —
    # bind-mounted over this directory at runtime, one <tenant>.nginx.conf each.
    include /etc/nginx/conf.d/*.conf;

    # ── Internal-only flush endpoint (mirrors the apache :8088 + flush.cgi) ──
    # Not exposed to the host / not routed by Traefik → docker-network peers
    # only (e.g. Sling itself calling http://webcache:8088/flush?prefix=...).
    server {
        listen 8088;
        server_name _;

        location = /flush {
            default_type text/plain;
            content_by_lua_block {
                local prefix = ngx.var.arg_prefix
                -- allowlist: /apps/… or /content/…, safe charset only (Lua patterns)
                local ok = prefix
                    and (prefix:find("^/apps/") or prefix:find("^/content/"))
                    and not prefix:find("[^%w/_%.%-]")
                if not ok then
                    ngx.status = 400
                    ngx.say("prefix must be /apps/... or /content/... (unencoded)")
                    return
                end
                local token = os.getenv("FLUSH_TOKEN")
                if token and token ~= "" and ngx.req.get_headers()["X-Flush-Token"] ~= token then
                    ngx.status = 403
                    ngx.say("missing or invalid X-Flush-Token")
                    return
                end
                local h = io.popen("/usr/local/bin/purge-cache.sh '" .. prefix .. "'")
                local out = h:read("*a")
                h:close()
                ngx.say("flushed prefix: " .. prefix .. "\n" .. (out or ""))
            }
        }
    }
}
