# slingslop-app-base — shared per-tenant parameter menu.
#
# This role renders NO files. It only declares the configuration parameters
# (with defaults + doc-comments) that describe a public-facing Slingslop tenant.
# A tenant is a host -> content-root mapping; it usually maps to its own app, but
# several tenants can reuse ONE app at different content roots (then set appsRoot
# to the reused app's clientlib root — see the `appsRoot` param below).
# slingslop-edge / slingslop-webcache / slingslop-runtime inherit it so the
# parameter menu lives in exactly one place.
#
# Values marked "no default" MUST be supplied by operations, per tenant, in the
# environment file. Everything else has a convention-based default derived from
# the tenant name.

config:

  # ---- node-level (one value per box, set in the environment) ----

  # Base domain. A public app is served at <subdomain>.<domain>.
  # No default — operations MUST set it per environment.
  domain: localhost

  # ---- per-tenant (per-app) values ----

  # JCR content root, e.g. /content/slingslop/zengarden. Drives proxy + mapping.
  # No default — every tenant must declare it.
  contentRoot: /content/slingslop/${tenant}

  # Scripts / clientlib root under /apps, e.g. /apps/slingslop/zengarden. The
  # webcache always passes this prefix through UNREWRITTEN (the app's css/js),
  # so it MUST match where the app actually serves its clientlibs. The default
  # only fits an app whose scripts live at /apps/slingslop/<tenant>; override it
  # when the tenant reuses another app (e.g. `zen` -> /apps/slingslop/zengarden)
  # or the app's root differs (e.g. /apps/<tenant>). Wrong value = 404'd css/js.
  appsRoot: /apps/slingslop/${tenant}

  # Left-most DNS label. Final host = <subdomain>.<domain>.
  # Use 'www' for the primary site.
  subdomain: ${tenant}

  # Home page node name mapped from '/', e.g. 'home' -> home.html.
  homePage: home

  # contentRoot with the leading '/content' stripped — the "short" internal
  # path the webcache re-expands (e.g. /slingslop/zengarden, /sling-matrix).
  # Derived; operations never sets this.
  shortContentPath: "${stringUtils:removeStart(contentRoot, '/content')}"

  # Extra host names ("add more domains") the webcache + Traefik answer for, on
  # top of <subdomain>.<domain>. The primary 'www' site usually adds the bare
  # apex domain; a normal sub-domain app leaves this empty.
  serverAliases: []

  # ---- webcache request filtering & cache policy (the app's front-line ----
  # ---- protection). ALL THREE variants (apache/varnish/nginx) read the ----
  # ---- SAME parameters below; each renders them in its own syntax. The  ----
  # ---- defaults suit a normal public HTML app — tighten/extend per tenant. --
  #
  # See devops/webcache.md for the per-app knob table, and
  # devops/conga-handlebars-101.md for a worked how-to on turning any hard-coded
  # template value into a tenant parameter.

  # ALLOW LIST — extra path prefixes that reach Sling UNREWRITTEN (no short-URL
  # re-expansion), e.g. /bin/public for the cache-busting clientlib servlet.
  # The app's own ${appsRoot} is always allowed; add more here. Empty by default.
  passthroughPaths: []

  # HTTP methods forwarded to Sling. Anything else is rejected at the cache with
  # 405 (a public site is read-only). Empty = block everything.
  allowedMethods:
  - GET
  - HEAD

  # Sling selector / view names that are ALWAYS blocked (dangerous JCR dumps),
  # matched as ".<name>." anywhere in the path. Empty = block none.
  denySelectors:
  - infinity
  - tidy
  - sysview
  - docview
  - children
  - query

  # Internal JCR path prefixes never reachable through the cache, matched as
  # "^/<prefix>/". Empty = block none.
  denyPathPrefixes:
  - system
  - bin
  - crx
  - libs/granite

  # Path prefixes under which a `.json` RESOURCE EXTENSION is allowed (the true
  # extension, ignoring any /suffix). Everything else ending in a `.json`
  # extension is denied. Empty = expose no JSON at all.
  jsonAllowlist: []

  # UNCACHED paths / selectors / extensions: URL patterns (regex, matched against
  # the request path) that must NEVER be cached — still proxied to Sling, but
  # always fetched fresh. Empty = cache everything cacheable.
  uncachedPatterns: []

  # Cache lifetime for HTML-ish responses, in seconds (short — content changes).
  htmlTtlSeconds: 10

  # Cache lifetime for long-lived static assets (images/fonts), in seconds.
  staticTtlSeconds: 2592000   # 30 days

  # Cache lifetime for css/js specifically, in seconds. Defaults to staticTtlSeconds
  # (assumes URL-fingerprinted clientlibs). Override to a short value (e.g. 300) for
  # apps with NO cache-busting on their css/js URLs, so a deploy is picked up quickly
  # instead of waiting out the long static TTL (e.g. zengarden — see clientlib
  # cache-busting notes in devops/webcache.md).
  cssJsTtlSeconds: "${staticTtlSeconds}"

  # Shared secret for the internal cache-flush endpoint (:8088/flush?prefix=...,
  # same on all 3 engines — see devops/webcache.md). Empty = no token required
  # (docker-network isolation is the primary control on every variant). Apache
  # and nginx read this as a runtime FLUSH_TOKEN container env var instead (so
  # ops can rotate it without regenerating config); Varnish has no env-var
  # access from VCL, so it's baked into the generated .vcl here instead.
  flushToken: ""

  # Traefik middleware chain applied to this app's router. Gated apps add
  # 'editor-basicauth' (and optionally 'editor-allowlist').
  middlewares:
  - sec-headers

  # Traefik service backend for this app's router. Public-cached apps point at
  # the webcache; a public-uncached app can override to sling:8080.
  backendHost: webcache
  backendPort: 80
