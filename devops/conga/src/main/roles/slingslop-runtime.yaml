# slingslop-runtime — the Sling instance side. Generates:
#  * the OUTBOUND short-URL half: a FileVault (vlt) package of /etc/map host
#    mappings, so resourceResolver.map() writes short links into the markup;
#  * the launcher Feature Model aggregate that lists the app content packages
#    plus the generated slingslop.slingmappings package.
#
# Variants select the Oak nodestore flavour used by the launcher.

inherits:
- role: slingslop-app-base

variants:
- variant: composite-nodestore
  config:
    nodeStore: composite
- variant: segment
  config:
    nodeStore: segment

templateDir: slingslop-runtime

files:

# OUTBOUND short URLs: one /etc/map host node per publicly-routed app.
# FileVault layout: jcr_root/etc/map/https/<host>/.content.xml
- file: .content.xml
  dir: "slingmappings/jcr_root/etc/map/https/${subdomain}.${domain}"
  template: mapping.content.xml.hbs
  multiply: tenant
  multiplyOptions:
    roles:
    - public-cached
    - public-uncached
    - gated
  validators:
  - xml

# FileVault package descriptor — rendered once per node.
- file: filter.xml
  dir: slingmappings/META-INF/vault
  template: filter.xml.hbs
  validators:
  - xml

- file: properties.xml
  dir: slingmappings/META-INF/vault
  template: properties.xml.hbs
  # No xml validator: the FileVault properties.xml carries a DOCTYPE (required by
  # java.util.Properties.loadFromXML at install time); a well-formedness check
  # would try to fetch the external DTD offline and fail.
  validators: []

# Launcher Feature Model aggregate — lists app packages + the mappings package.
- file: apps-aggregate.json
  dir: features
  template: apps-aggregate.json.hbs
  validators:
  - json

# Felix HTTP (Jetty 12) JVM -D options, rendered from the node's httpVirtualThreads
# / httpThreadpoolMax params. Consumed by BOTH launcher/launch.sh (local dev) and
# the Ansible slingslop role (appended to the container's EXTRA_JAVA_OPTS), so this
# environment file is the single GitOps source of truth. Empty = defaults.
- file: http-java-opts
  dir: env
  template: http-java-opts.hbs
  validators: []

# Sample-content install allow-list, rendered from the node's sampleContent param.
# Consumed by the Ansible slingslop role's install-sample-content task (passed to
# install-sample-content.sh as SAMPLE_CONTENT_INCLUDE). Empty file = install every
# staged package (historical behaviour); a comma-separated token list restricts
# the (re)install to matching *.zip names, so ops need not always install all.
- file: sample-content
  dir: env
  template: sample-content.hbs
  validators: []

config:
  # Maven coordinates of the generated /etc/map FileVault package, referenced by
  # the feature aggregate and installed next to slingslop.complete.
  mappingsPackageGroup: org.motorbrot
  mappingsPackageName: slingslop.slingmappings
  mappingsPackageVersion: 0.0.1-SNAPSHOT
  # Coordinates of the existing 'complete' (all) content package. The
  # ${...} is a Feature Model launch-time variable, escaped so CONGA emits it
  # literally rather than trying to resolve it.
  completePackageId: "org.motorbrot/slingslop.complete/\\${slingslop.launcher.version}/zip"

  # Felix HTTP (Jetty 12) request thread model, surfaced into EXTRA_JAVA_OPTS.
  # true = one virtual thread per request (JDK 21+; repo runs 25); false = the
  # classic bounded platform-thread pool. Same -D property used by the
  # container/Ansible path.
  httpVirtualThreads: false
  # Optional cap for the Jetty request thread pool (bounds the virtual-thread
  # pool when enabled). Empty = Felix/Jetty default (unlimited).
  httpThreadpoolMax: ""

  # Which staged sample-content packages to (re)install into the running instance
  # on each deploy (see the slingslop role's install-sample-content task). Each
  # entry is matched as a substring against the *.zip filenames baked into the
  # image at /opt/sling/sample-content (e.g. 'sling-matrix' matches
  # slingslop.sling-matrix.sample-content.zip). Empty (default) installs ALL of
  # them — the historical behaviour — so ops opts IN to a subset, never silently
  # loses content. The image always bakes the full set; this only gates install.
  sampleContent: []
