# local-plain — OPERATIONS-owned. Fastest inner loop: Sling runtime only, no
# edge, no webcache. Hit /content/... (or Sling-mapped) URLs on :8080 via
# launcher/launch.sh. CONGA emits only the runtime feature/mapping files.

config:
  domain: slingslop.local

nodes:

- node: localhost
  roles:
  - role: slingslop-runtime
    variant: segment
    # Local JVM tuning; rendered to env/http-java-opts, read by launcher/launch.sh.
    config:
      httpVirtualThreads: true
      httpThreadpoolMax: 200

tenants:

- tenant: zengarden
  roles:
  - public-cached
  config:
    contentRoot: /content/slingslop/zengarden

- tenant: sling-matrix
  roles:
  - public-cached
  config:
    contentRoot: /content/sling-matrix
    appsRoot: /apps/sling-matrix
    subdomain: www

- tenant: rage-against-ml
  roles:
  - public-cached
  config:
    contentRoot: /content/ratml
    appsRoot: /apps/ratml
    subdomain: ratml
    # css/js have no URL fingerprinting -> short TTL so a deploy is picked up quickly.
    cssJsTtlSeconds: 300
