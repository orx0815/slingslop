# prod.motorbrot — OPERATIONS-owned production environment.
#
# The ENTIRE per-deployment surface. Publish something = append one `- tenant:`
# block. A tenant is a host -> content-root mapping, NOT necessarily its own app:
# it usually points at its own app, but several tenants can reuse ONE app at
# different content roots (e.g. the content-only `zen` tenant serves the
# `zengarden` app from /content/slingslop/zen). When a tenant reuses another
# app, set `appsRoot` to that app's clientlib root or the webcache rewrites its
# css/js to a 404. See devops/conga/README.md ("Tenants vs apps").
# Fork = copy this file, change `domain` and the tenant list.
#
# Secrets (ACME e-mail, htpasswd) stay in the Ansible vault; only non-sensitive
# routing lives here.

config:
  domain: motorbrot.org

nodes:

- node: vps1
  roles:
  - role: slingslop-edge
    variant: acme
  - role: slingslop-webcache
    variant: apache
  - role: slingslop-runtime
    variant: composite-nodestore
    config:
      httpVirtualThreads: true
      httpThreadpoolMax: 200
      # Restrict which staged sample-content packages are (re)installed each deploy
      # (substring match on the *.zip names). Unset/empty = install all (default).
      # sampleContent: [zengarden, sling-matrix, digitalmedia]

tenants:

- tenant: zengarden
  roles:
  - public-cached
  config:
    contentRoot: /content/slingslop/zengarden
    
- tenant: zen
  roles:
  - public-cached
  config:
    contentRoot: /content/slingslop/zen
    # A tenant is NOT always its own app: this is a second mount of the
    # zengarden app at a different content root. Clientlibs are still served
    # from the zengarden app, so appsRoot must point there (NOT /apps/.../zen)
    # or the webcache's URL-shortener rewrites the css/js to a 404.
    appsRoot: /apps/slingslop/zengarden

# CONTENT-ONLY tenant: `zen` ships NO app of its own. It re-serves the existing
# `zengarden` app at a second content root. `/content/slingslop/zen` is created
# live in prod (a copy of zengarden) and lives in the content volume — it is NOT
# in git. Because the clientlibs are served by the zengarden app, appsRoot must
# point at the zengarden app root (NOT the /apps/slingslop/zen default), or the
# webcache URL-shortener rewrites its css/js to a 404. See devops/conga/README.md.
- tenant: zen
  roles:
  - public-cached
  config:
    contentRoot: /content/slingslop/zen
    appsRoot: /apps/slingslop/zengarden

- tenant: sling-matrix
  roles:
  - public-cached
  config:
    contentRoot: /content/sling-matrix
    appsRoot: /apps/sling-matrix
    subdomain: www
    serverAliases:
    - "${domain}"
    passthroughPaths:
    - /bin/public
    # feature-image renders <picture> renditions served from the shared DML
    # asset store. Those live under a DIFFERENT content root, so the tenant's
    # short-URL catch-all would rewrite them under /content/sling-matrix and
    # 404. Allow the published asset tree through unrewritten (read-only GET;
    # POST/DELETE and .json are still blocked by the shared webcache filters).
    - /content/motorbrot/dma/assets

- tenant: digitalmedia
  roles:
  - gated
  config:
    contentRoot: /content/digitalmedia
    # author/preview host: basicAuth-gated at the edge, no webcache in front,
    # so Traefik proxies straight to Sling.
    backendHost: sling
    backendPort: 8080
    middlewares:
    - sec-headers
    - editor-basicauth

- tenant: alf-vs-agent
  roles:
  - public-cached
  config:
    contentRoot: /content/alf-vs-agent
    # Clientlibs live at /apps/alf-vs-agent (not the /apps/slingslop/${tenant}
    # default), so appsRoot must be set explicitly for the css/js passthrough.
    appsRoot: /apps/alf-vs-agent

- tenant: cyberpunk-alpaca
  roles:
  - public-cached
  config:
    contentRoot: /content/cyberpunk-alpaca
    appsRoot: /apps/cyberpunk-alpaca
