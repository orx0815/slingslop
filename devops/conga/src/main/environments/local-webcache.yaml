# local-webcache — OPERATIONS-owned.
# Webcache-only stack (variant: apache|nginx|varnish) in front of a Sling
# instance running elsewhere — no Traefik/TLS, no runtime role. Two uses:
#   1. manually comparing cache-engine variants without the full vagrant harness
#   2. feeding devops/docker-compose.yml's quickstart (see devops/README.md),
#      which bind-mounts target/configuration/local-webcache/localhost/webcache/
#      over the webcache image's sites-enabled.
# Map hostnames to 127.0.0.1 in /etc/hosts, e.g. zengarden.slingslop.local,
# www.slingslop.local.
#
# Add an app = append one `- tenant:` block below. Nothing else changes.

config:
  # Base domain for this environment. Visible to nodes and tenants alike.
  domain: slingslop.local

nodes:

- node: localhost
  roles:
  - role: slingslop-webcache
    variant: apache

tenants:

- tenant: zengarden
  roles:
  - public-cached
  config:
    contentRoot: /content/slingslop/zengarden
    # zengarden's css/js have no URL fingerprinting -> short TTL so a deploy is picked up quickly.
    cssJsTtlSeconds: 300

- tenant: sling-matrix
  roles:
  - public-cached
  config:
    contentRoot: /content/sling-matrix
    appsRoot: /apps/sling-matrix
    subdomain: www
    serverAliases:
    - "${domain}"
    passthroughPaths:
    - /bin/public
    # See prod-motorbrot.yaml: reach the shared DML asset renditions (feature-image).
    - /content/motorbrot/dml/assets

- tenant: rage-against-ml
  roles:
  - public-cached
  config:
    contentRoot: /content/ratml
    appsRoot: /apps/ratml
    subdomain: ratml
    # css/js have no URL fingerprinting -> short TTL so a deploy is picked up quickly.
    cssJsTtlSeconds: 300
