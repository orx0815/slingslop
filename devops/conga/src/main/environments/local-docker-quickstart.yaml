# local-docker-quickstart — OPERATIONS-owned.
# Feeds devops/docker-compose.yml's webcache container (see devops/README.md's
# "Quick start" section) — the standalone "docker compose up" sandbox, no
# Traefik/edge tier.
# Domain matches the /etc/hosts entries documented there
# (www.motorbrot.local, zengarden.motorbrot.local); the *.org aliases mirror
# what the previous hand-written vhosts also answered to.
#
# NOT used by the Ansible/vagrant local-webcache or local-full environments —
# those are a separate test harness (see docs/conga-config-generation-concept.md).
#
# No editor/author tenant here — for local development, edit content directly
# on plain Sling at :8080 instead.

config:
  domain: motorbrot.local

nodes:

- node: localhost
  roles:
  - role: slingslop-webcache
    variant: apache

tenants:

- tenant: zengarden
  roles:
  - public-cached
  config:
    contentRoot: /content/slingslop/zengarden
    serverAliases:
    - zengarden.motorbrot.org
    # zengarden's css/js have no URL fingerprinting -> short TTL so a deploy is picked up quickly.
    cssJsTtlSeconds: 300

- tenant: sling-matrix
  roles:
  - public-cached
  config:
    contentRoot: /content/sling-matrix
    appsRoot: /apps/sling-matrix
    subdomain: www
    serverAliases:
    - "${domain}"
    - www.motorbrot.org
    - motorbrot.org
    passthroughPaths:
    - /bin/public
