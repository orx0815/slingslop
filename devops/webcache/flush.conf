# Internal-only cache-flush endpoint.
#
# Listens on :8088 — deliberately NOT published to the host and NOT routed by
# Traefik, so only peers on the docker network (e.g. the Sling container calling
# http://webcache:8088/flush?prefix=/apps/sling-matrix/) can reach it. Network
# isolation is the primary control; set FLUSH_TOKEN in the container env to also
# require an X-Flush-Token header (see flush.cgi).
Listen 8088

<VirtualHost *:8088>
    ServerName webcache-flush.internal
    ErrorLog /var/log/apache2/flush-err.log
    TransferLog /var/log/apache2/flush-access.log

    # /flush -> CGI (ScriptAlias marks the target as a CGI handler).
    ScriptAlias /flush /usr/lib/cgi-bin/flush
    <Directory "/usr/lib/cgi-bin">
        Options +ExecCGI
        Require all granted
    </Directory>
</VirtualHost>
