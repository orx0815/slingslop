---
# Ship the webcache vhosts that CONGA generated for this environment/node.
# One `<app>.conf` per public-cached tenant is rendered by `mvn -pl devops/conga`
# into devops/conga/target/configuration/<env>/<node>/webcache/ ; here we just
# copy that directory onto the host, where compose bind-mounts it over the
# image's /etc/apache2/sites-enabled. Adding an app needs *no* change here —
# only a new tenant in the CONGA environment file.

- name: Create webcache config dir
  ansible.builtin.file:
    path: "{{ slingslop_root }}/data/webcache"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Locate CONGA webcache output (must exist on the control node)
  ansible.builtin.stat:
    path: "{{ conga_config_dir }}/webcache"
  delegate_to: localhost
  become: false
  register: conga_webcache_dir

- name: Fail with a helpful hint when CONGA output is missing
  ansible.builtin.fail:
    msg: >-
      No CONGA webcache output at {{ conga_config_dir }}/webcache .
      Run `mvn -pl devops/conga clean package` on the control node first
      (conga_env={{ conga_env }}, conga_node={{ conga_node }}).
  when: not conga_webcache_dir.stat.exists

- name: Ship CONGA-generated webcache vhosts (one per public-cached app)
  ansible.builtin.copy:
    src: "{{ conga_config_dir }}/webcache/"
    dest: "{{ slingslop_root }}/data/webcache/"
    owner: root
    group: root
    mode: "0644"
  notify: restart webcache

