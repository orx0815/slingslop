---
# Deploy-time short-URL mapping. Installs the CONGA-generated host-based /etc/map
# package into the RUNNING Sling. This is what lets ops add a tenant — a host →
# content-root binding, e.g. www.<domain> → /content/realProdContent/anothermatrix
# — at DEPLOY time, WITHOUT rebuilding the image. /etc/map is JCR content, so it
# must be installed at runtime, not baked as a static (image-wide) OSGi config.
#
# Extracted so the GitOps edge-config deploy (Agent Smith added a tenant) can run
# just this, against the already-running Sling, without touching the container.

- name: Ensure properties.xml carries the FileVault DOCTYPE (CONGA strips it)
  ansible.builtin.replace:
    path: "{{ conga_config_dir }}/slingmappings/META-INF/vault/properties.xml"
    regexp: '(<\?xml[^>]*\?>)(?!<!DOCTYPE)'
    replace: '\1<!DOCTYPE properties SYSTEM "http://java.sun.com/dtd/properties.dtd">'
  delegate_to: localhost
  become: false

- name: Package the slingmappings vlt zip (jcr_root + META-INF at zip root)
  ansible.builtin.shell:
    cmd: rm -f slingslop.slingmappings.zip && zip -qr slingslop.slingmappings.zip jcr_root META-INF
    chdir: "{{ conga_config_dir }}/slingmappings"
  delegate_to: localhost
  become: false
  changed_when: true

- name: Copy mappings package to the host
  ansible.builtin.copy:
    src: "{{ conga_config_dir }}/slingmappings/slingslop.slingmappings.zip"
    dest: /tmp/slingslop.slingmappings.zip
    mode: "0644"

- name: Upload + install mappings package (Composum package manager)
  ansible.builtin.shell:
    cmd: |
      set -eu
      U='{{ sling_internal_url }}'
      AUTH='admin:{{ vault_sling_admin_password }}'
      READY_TIMEOUT=180

      # --- upload (capture HTTP status + body so failures are diagnosable) ---
      code=$(curl -s --connect-timeout 10 --max-time 180 \
              -o /tmp/cpm-upload.json -w '%{http_code}' -u "$AUTH" \
              -F file=@/tmp/slingslop.slingmappings.zip -F force=true \
              "$U/bin/cpm/package.upload.json")
      if [ "$code" != "200" ]; then
        echo "package.upload failed: HTTP $code" >&2
        cat /tmp/cpm-upload.json >&2 || true
        exit 1
      fi
      P=$(sed -n 's/.*"path":"\([^"]*\)".*/\1/p' /tmp/cpm-upload.json)
      if [ -z "$P" ]; then
        echo "package.upload returned no package path" >&2
        cat /tmp/cpm-upload.json >&2 || true
        exit 1
      fi

      # --- install (retry on transient cold-start codes, same as
      # install-sample-content.sh's install_pkg(): even after the instance
      # answers HTTP, Composum's package manager can still 500/503 briefly
      # while bundles/node types settle) ---
      d=$(( $(date +%s) + READY_TIMEOUT ))
      while :; do
        code=$(curl -s --connect-timeout 10 --max-time 300 \
                -o /tmp/cpm-install.json -w '%{http_code}' -u "$AUTH" -X POST \
                "$U/bin/cpm/package.install.json$P")
        if [ "$code" = "200" ]; then
          echo "installed $P (HTTP $code)"
          break
        fi
        case "$code" in
          000|404|500|503)
            if [ "$(date +%s)" -lt "$d" ]; then
              sleep 3
              continue
            fi
            echo "package.install still $code after ${READY_TIMEOUT}s for $P" >&2
            cat /tmp/cpm-install.json >&2 || true
            exit 1
            ;;
          *)
            echo "package.install failed for $P: HTTP $code" >&2
            cat /tmp/cpm-install.json >&2 || true
            exit 1
            ;;
        esac
      done
  changed_when: true

- name: Remove the uploaded package tarball from the host
  ansible.builtin.file:
    path: /tmp/slingslop.slingmappings.zip
    state: absent
