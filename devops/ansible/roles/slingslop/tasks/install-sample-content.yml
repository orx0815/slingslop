---
# Install the demo sample-content into the running Sling. Sample-content is NOT
# baked into the composite seed (code-only image); it lives as *.zip under
# /opt/sling/sample-content in the image and is (re)installed here on every
# deploy. ALWAYS overwritten — each package filter is scoped to its own
# /content/... root, so user content on other roots (e.g. the content-only
# 'zen' tenant) is untouched. Runs AFTER the readiness gate.

- name: Load sample-content install allow-list (CONGA env/sample-content; empty = all)
  # Comma-separated token list rendered per node from the slingslop-runtime
  # `sampleContent` param. Empty/absent → install every staged package.
  ansible.builtin.set_fact:
    slingslop_sample_content_include: >-
      {{ lookup('file', conga_config_dir + '/env/sample-content', errors='ignore')
         | default('', true) | trim }}

- name: Install demo sample-content into the running Sling (always overwritten)
  # Pass the password inline, single-quoted, in a `shell` task (same pattern as
  # install-mappings.yml). `command` arg-splitting mangles a password with spaces,
  # and passing it via `environment:` + bare `-e SLING_PASSWORD` is stripped by
  # this play's `become`/sudo. Single quotes preserve spaces and don't depend on
  # the environment surviving sudo.
  #
  # no_log hides the whole result (the `cmd` embeds the vault password), so a raw
  # failure is opaque. We therefore don't fail here — the two tasks below surface
  # the script's stdout/stderr (which carry only "[sample-content] ..." messages
  # and HTTP codes, never the password) and then fail with the real cause.
  ansible.builtin.shell:
    cmd: >
      docker exec
      -e SLING_URL=http://127.0.0.1:8080
      -e SLING_USER=admin
      -e SLING_PASSWORD='{{ vault_sling_admin_password }}'
      -e SAMPLE_CONTENT_INCLUDE='{{ slingslop_sample_content_include }}'
      slingslop bash /opt/sling/bin/install-sample-content.sh
  register: sample_content_install
  changed_when: true
  failed_when: false
  no_log: true

- name: Show sample-content install output (sanitized — no credentials)
  # Prints ONLY stdout/stderr lines (password-free). Never dump the whole result
  # object: sample_content_install.cmd / .invocation still carry the password.
  ansible.builtin.debug:
    msg: >-
      {{ (sample_content_install.stdout_lines | default([]))
         + (sample_content_install.stderr_lines | default([])) }}
  when: sample_content_install.rc | default(1) != 0

- name: Fail if sample-content install did not succeed
  ansible.builtin.fail:
    msg: >-
      sample-content install failed (rc={{ sample_content_install.rc | default('unknown') }}).
      See the sanitized script output above for the failing package / HTTP code.
  when: sample_content_install.rc | default(1) != 0
