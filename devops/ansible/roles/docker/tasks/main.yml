---
- name: Ensure /etc/apt/keyrings exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Add Docker apt key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"
    force: false

- name: Add Docker apt repo
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else ansible_architecture }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} stable"
    state: present
    filename: docker
    update_cache: true

- name: Install Docker engine + compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present

- name: Install python docker SDK (for community.docker if used)
  ansible.builtin.apt:
    name:
      - python3-docker
    state: present

- name: Add deploy user to docker group
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    groups: docker
    append: true

- name: Ensure /etc/docker exists
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure Docker daemon
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "{{ docker_log_max_size }}",
          "max-file": "{{ docker_log_max_files | string }}"
        },
        "live-restore": true,
        "no-new-privileges": true,
        "userland-proxy": false,
        "default-address-pools": [
          { "base": "172.30.0.0/16", "size": 24 }
        ]
      }
  notify: restart docker

- name: Ensure docker.service systemd drop-in dir exists
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Allow older Docker API clients (Traefik's provider negotiates 1.24)
  ansible.builtin.copy:
    dest: /etc/systemd/system/docker.service.d/10-min-api-version.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible — slingslop/docker role.
      # Docker Engine 29+ raised its minimum accepted API version to 1.40, but
      # Traefik's docker provider still speaks 1.24 (and ignores the
      # DOCKER_API_VERSION env when an explicit socket endpoint is set). Relax
      # the daemon minimum so Traefik and other older-API clients keep working.
      [Service]
      Environment=DOCKER_MIN_API_VERSION={{ docker_min_api_version }}
  notify: restart docker

- name: Start & enable docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Ensure GHCR login config (only if pull token set)
  when: vault_ghcr_pull_token | default('') | length > 0
  block:
    - name: Ensure root .docker dir
      ansible.builtin.file:
        path: /root/.docker
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Write GHCR auth config
      ansible.builtin.copy:
        dest: /root/.docker/config.json
        owner: root
        group: root
        mode: "0600"
        content: |
          {
            "auths": {
              "ghcr.io": {
                "auth": "{{ (vault_ghcr_pull_user + ':' + vault_ghcr_pull_token) | b64encode }}"
              }
            }
          }

- name: Create deployment root
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  loop:
    - "{{ slingslop_root }}"
    - "{{ slingslop_secrets_dir }}"
    - "{{ slingslop_root }}/data"
    - "{{ slingslop_root }}/data/traefik"

- name: Render compose orchestrator wrapper
  ansible.builtin.copy:
    dest: "{{ slingslop_root }}/dc"
    owner: root
    group: root
    mode: "0750"
    content: |
      #!/bin/sh
      # Thin wrapper that always feeds Compose all three project files.
      set -e
      cd "{{ slingslop_root }}"
      exec docker compose \
          -p {{ docker_compose_project_name }} \
          -f compose.edge.yml \
          -f compose.app.yml \
          -f compose.obs.yml \
          "$@"

- name: Ensure compose file stubs exist (real content rendered by later roles)
  ansible.builtin.copy:
    dest: "{{ slingslop_root }}/{{ item }}"
    owner: root
    group: root
    mode: "0640"
    force: false   # do not overwrite if a role already wrote real content
    content: |
      # placeholder — replaced by the role that owns this stack
      services: {}
  loop:
    - compose.edge.yml
    - compose.app.yml
    - compose.obs.yml

- name: Create shared docker network
  community.docker.docker_network:
    name: "{{ docker_network_name }}"
    state: present
    driver: bridge

- name: Apply pending Docker daemon changes before dependent roles start containers
  ansible.builtin.meta: flush_handlers
