---
- name: Create traefik data dirs
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  loop:
    - "{{ slingslop_root }}/data/traefik"
    - "{{ slingslop_root }}/data/traefik/dynamic"

- name: Render traefik static config
  ansible.builtin.template:
    src: traefik.yml.j2
    dest: "{{ slingslop_root }}/data/traefik/traefik.yml"
    owner: root
    group: root
    mode: "0640"
  notify: restart traefik

- name: Render traefik dynamic config (middlewares + routers)
  ansible.builtin.template:
    src: dynamic.yml.j2
    dest: "{{ slingslop_root }}/data/traefik/dynamic/dynamic.yml"
    owner: root
    group: root
    mode: "0640"
  notify: reload traefik

# Per-app routers are generated by CONGA (one router-<app>.yml per public app)
# and dropped into the file-provider dir alongside the ansible-owned dynamic.yml
# (which still defines the shared middlewares — sec-headers, editor-basicauth —
# these routers reference, plus the obs/dashboard routers). CONGA's own
# traefik.yml/middlewares.yml are intentionally NOT shipped: ops owns those.
# Extracted into ship-routers.yml so a config-only edge deploy can reuse it.
- name: Ship CONGA-generated per-app Traefik routers
  ansible.builtin.import_tasks: ship-routers.yml

- name: Write editor basicAuth users file
  ansible.builtin.copy:
    dest: "{{ slingslop_secrets_dir }}/editor.htpasswd"
    owner: root
    group: root
    mode: "0640"
    # Strip inline '# ...' comments + trailing spaces per line: YAML block
    # scalars keep '#' literal, and Traefik's basicAuth usersFile parser rejects
    # annotated hashes ('error parsing BasicUser'). htpasswd hashes never use '#'.
    content: "{{ vault_editor_basicauth_users_htpasswd | regex_replace('(?m)[ \\t]*#.*$', '') }}"
  notify: restart traefik

- name: Write grafana basicAuth users file
  ansible.builtin.copy:
    dest: "{{ slingslop_secrets_dir }}/grafana.htpasswd"
    owner: root
    group: root
    mode: "0640"
    content: "{{ vault_grafana_basicauth_users_htpasswd | regex_replace('(?m)[ \\t]*#.*$', '') }}"
  notify: restart traefik

- name: Write traefik dashboard basicAuth users file
  when: traefik_dashboard_enabled | default(true) | bool
  ansible.builtin.copy:
    dest: "{{ slingslop_secrets_dir }}/dashboard.htpasswd"
    owner: root
    group: root
    mode: "0640"
    content: "{{ vault_traefik_dashboard_htpasswd | regex_replace('(?m)[ \\t]*#.*$', '') }}"
  notify: restart traefik

- name: Touch ACME storage file (Traefik requires existing file, 0600)
  ansible.builtin.file:
    path: "{{ slingslop_root }}/data/traefik/acme.json"
    state: touch
    owner: root
    group: root
    mode: "0600"
    modification_time: preserve
    access_time: preserve

- name: Render edge compose file
  ansible.builtin.template:
    src: compose.edge.yml.j2
    dest: "{{ slingslop_root }}/compose.edge.yml"
    owner: root
    group: root
    mode: "0640"

# Local test path: ship a locally-built webcache image (containing freshly-made
# devops/webcache changes) into the host instead of pulling from GHCR.
- name: Load locally-built webcache image tarball
  when: webcache_image_load_tar | default('') | length > 0
  block:
    - name: Copy webcache image tarball to host
      ansible.builtin.copy:
        src: "{{ webcache_image_load_tar }}"
        dest: /tmp/webcache-image.tar
        mode: "0644"
    - name: docker load the webcache image
      ansible.builtin.command:
        cmd: "docker load -i /tmp/webcache-image.tar"
      register: webcache_img_load
      changed_when: "'Loaded image' in webcache_img_load.stdout"
    - name: Remove the webcache tarball
      ansible.builtin.file:
        path: /tmp/webcache-image.tar
        state: absent

- name: Bring up edge stack
  ansible.builtin.command:
    cmd: "{{ slingslop_root }}/dc up -d --no-deps traefik webcache"
  register: edge_up
  changed_when: "'Started' in edge_up.stderr or 'Recreated' in edge_up.stderr or 'Created' in edge_up.stderr"
