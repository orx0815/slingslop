---
# ---------------------------------------------------------------------------
# Non-secret configuration. Override per-host in host_vars/<host>.yml.
# Secrets live in vault.yml (encrypted with ansible-vault).
# ---------------------------------------------------------------------------

# Base domain. The deployment publishes these sub-domains under it:
#   www.<domain>       → public (sling-matrix), cached
#   zengarden.<domain> → public (legacy CSS Zen Garden app), cached
#   editor.<domain>    → Sling author, basicAuth-gated
#   grafana.<domain>   → Grafana, basicAuth-gated
#   logs.<domain>      → same Grafana (alias host); browse logs via Explore → Loki
domain: example.org

# Let's Encrypt / ACME. Keep true for real deployments (public DNS + ports
# 80/443 reachable). Set false for local testing on a private VM, where ACME
# cannot validate — Traefik then serves its built-in self-signed certificate.
traefik_acme_enabled: true

# Traefik dashboard at https://traefik.<domain>/ — protected by basicAuth
# (vault_traefik_dashboard_htpasswd) and the same IP allow-list as the other
# gated endpoints. Set false to not expose it at all.
traefik_dashboard_enabled: true

# Trusted source ranges for the gated (editor / grafana) endpoints.
# Leave empty to disable IP-allow-listing (basicAuth is still enforced).
editor_allowlist_cidrs: []
# Example:
# editor_allowlist_cidrs:
#   - 203.0.113.0/24
#   - 198.51.100.42/32

# OS / host basics
timezone: Etc/UTC
locale:   en_US.UTF-8
ipv6_enabled: false

# Linux login user that Ansible uses for non-bootstrap runs.
deploy_user: deploy

# SSH hardening
ssh_port: 22                 # change to something non-standard if you wish
ssh_allowed_users:
  - "{{ deploy_user }}"

# Optional: enable auditd. Cheap on a single-app VPS; adds ~30 MB RAM.
enable_auditd: false

# Docker
docker_compose_project_name: slingslop
docker_network_name: slingslop_net

# Lowest Docker Engine API version the daemon will accept. Docker Engine 29+
# defaults its minimum to 1.40, but Traefik's docker provider still negotiates
# 1.24 (and ignores DOCKER_API_VERSION when given an explicit socket endpoint).
# Relaxing the daemon minimum lets Traefik and other older-API clients work.
docker_min_api_version: "1.24"

# Images (override per-environment if you fork)
# NOTE: must track the branch actually deployed to this host (the floating
# "<branch>-composite" tag ci-cd.yml pushes on every push to that branch), NOT
# "main". update-slingslop.yml always overrides this with the exact sha-tagged
# image, but site.yml (the "site" infra play) does NOT — it applies the
# slingslop role with whatever this default is, so a stale value here silently
# redeploys the wrong app set on a manual convergence run.
slingslop_image: ghcr.io/orx0815/slingslop:motorbrot_prod-composite
# Same reasoning as slingslop_image above: publish-webcache only ever pushes
# "<branch_tag>" and "sha-<sha>" tags, never "latest" — site.yml renders the
# edge compose with this default (unlike update-webcache.yml, which overrides
# it), so it must track the deployed branch's floating tag too.
webcache_image:  ghcr.io/orx0815/slingslop-webcache:motorbrot_prod
# Same idea, nginx (OpenResty) variant. Only used when the CONGA environment's
# slingslop-webcache role picks `variant: nginx` — see roles/webcache "Detect
# which webcache-variant marker CONGA rendered". Nothing to set for varnish —
# it's the stock `varnish:7.5` image, no custom build/publish needed.
webcache_image_nginx: ghcr.io/orx0815/slingslop-webcache-nginx:motorbrot_prod
webcache_image_varnish: varnish:7.5
# RAM cap for the varnish variant (malloc storage) — no disk cache, so this IS
# the whole cache budget; cold on every restart (see devops/webcache.md).
varnish_cache_size: 512m
# Optional shared secret for the internal :8088/flush endpoint (apache/nginx
# read it as a container env var; varnish instead bakes the equivalent
# `flushToken` tenant param straight into its generated VCL — see
# slingslop-app-base.yaml). Empty = no token required on any variant, relying
# on docker-network isolation alone (see devops/webcache.md).
webcache_flush_token: ""
traefik_image:   traefik:v3.2
prometheus_image: prom/prometheus:v2.55.1
grafana_image:    grafana/grafana:11.3.1
loki_image:       grafana/loki:3.2.1
promtail_image:   grafana/promtail:3.2.1
node_exporter_image: prom/node-exporter:v1.8.2
# v0.49.1 could not read the container-level cgroups on newer Docker/overlay2
# layouts ("failed to identify the read-write layer ID ... mount-id: no such
# file or directory") — every per-container panel on the Containers dashboard
# was silently empty. v0.53.0+ moved the image to ghcr.io; v0.56.0+ dropped
# support for Docker < 25.0, which is what actually fixed it here.
cadvisor_image:      ghcr.io/google/cadvisor:v0.60.5

# Pull the slingslop image from its registry before starting the container.
# Set false when the image was loaded onto the host out-of-band (e.g. the local
# Vagrant test `docker save | docker load`s a locally-built image).
slingslop_image_pull: true

# Optional: path (on the control node) to a `docker save` tarball of the
# slingslop image. When set, it is copied to the host and `docker load`ed before
# the container starts — the way the local Vagrant test ships a locally-built
# image containing freshly-added apps. Empty = registry pull (the prod default).
slingslop_image_load_tar: ""

# Same mechanism as slingslop_image_load_tar above, for the webcache image —
# lets the local Vagrant test exercise LOCAL devops/webcache changes instead of
# whatever was last published to GHCR. Empty = registry pull (the prod default).
webcache_image_load_tar: ""

# ---------------------------------------------------------------------------
# CONGA-generated deploy config (Pattern A — see docs/conga-config-generation-concept.md §6)
# ---------------------------------------------------------------------------
# The webcache + traefik roles SHIP the per-app files CONGA rendered for this
# environment/node instead of hand-rendering one `.j2` per app. Adding a public
# app is then: append a tenant to the matching CONGA environment, `mvn -pl
# devops/conga package`, and re-run this playbook.
#
# `conga_env` must be the CONGA environment whose `domain:` equals this
# deployment's `domain` (prod-motorbrot → motorbrot.org). A fork points these at
# its own environment file. The generated tree lives on the *control node* (the
# repo), so Ansible copies from there.
conga_env:  prod-motorbrot
conga_node: vps1
conga_config_dir: "{{ playbook_dir }}/../../../devops/conga/target/configuration/{{ conga_env }}/{{ conga_node }}"

# Filesystem layout on the VPS
slingslop_root: /opt/slingslop
slingslop_secrets_dir: "{{ slingslop_root }}/secrets"
backup_root: /var/backups/slingslop
backup_retention_days: 14

# Retention windows (the disk-fill cap)
loki_retention_days: 14
prometheus_retention_time: 14d
prometheus_retention_size: 2GB
docker_log_max_size: 10m
docker_log_max_files: 3

# Slingslop runtime settings
slingslop_java_heap_max: 1g
slingslop_container_memory_limit: 2g    # docker --memory
slingslop_container_cpu_limit:    "1.5" # docker --cpus
