---
# ===========================================================================
# THE production vault. ONE encrypted file, committed byte-identical on EVERY
# branch (main, feature branches, deploy). Because it is the same everywhere,
# merges — including Agent Smith PRs merged via the GitHub UI — never conflict
# with it or clobber it. Security rests on the passphrase, never on the
# (publicly readable) ciphertext.
#
# Setup (once):
#   cp vault.example.yml vault.yml && $EDITOR vault.yml
#   ansible-vault encrypt devops/ansible/inventory/group_vars/all/vault.yml
#   # passphrase = the ANSIBLE_VAULT_PASSWORD repo secret (never committed)
# Edit later:
#   ansible-vault edit devops/ansible/inventory/group_vars/all/vault.yml
#
# Non-secret defaults live in main.yml (plaintext); local dev supplies vault_*
# via the Vagrant harness, so you do NOT need the passphrase just to hack
# locally.
#
# FORKING (your own VPS): replace vault.yml with YOUR OWN secrets under YOUR OWN
# passphrase, set your own ANSIBLE_VAULT_PASSWORD repo secret, and keep your
# vault on updates from upstream with a `merge=ours` attribute — see
# devops/README.md → "Forking with your own secrets".
#
# htpasswd helpers:
#   htpasswd -nbB admin '<password>'          # local (apt install apache2-utils)
#   docker run --rm httpd:2.4 htpasswd -nbB admin '<password>'   # no local install
# ===========================================================================

# Sling admin user password (replaces the default `admin/admin`).
vault_sling_admin_password: "ChangeMe-SlingAdmin-Long-Random"

# Public key (Ed25519 preferred) installed into deploy user's authorized_keys.
vault_ssh_admin_pubkey: |
  ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx you@laptop

# Let's Encrypt account email
vault_acme_email: ops@example.org

# Traefik dashboard basicAuth (user:$apr1$SALT$HASH).
vault_traefik_dashboard_htpasswd: "admin:$apr1$SALT$HASH"

# basicAuth gate in front of editor.<domain>. One htpasswd line per user.
vault_editor_basicauth_users_htpasswd: |
  editor:$apr1$SALT$HASH

# basicAuth gate in front of grafana.<domain> / logs.<domain>.
vault_grafana_basicauth_users_htpasswd: |
  ops:$apr1$SALT$HASH

# Grafana built-in admin (used for the first login + provisioning API).
vault_grafana_admin_password: "ChangeMe-Grafana-Long-Random"

# OPTIONAL — GHCR pull credentials for private images. Leave empty for public.
vault_ghcr_pull_user: ""
vault_ghcr_pull_token: ""
