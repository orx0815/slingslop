---
# Pull a newer webcache image and restart only that container.
#
#   ansible-playbook -i inventory/hosts.yml playbooks/update-webcache.yml --ask-vault-pass
#
# CI passes the exact image built from the pushed commit, e.g.:
#   -e webcache_image=ghcr.io/orx0815/slingslop-webcache:sha-<sha>
# The edge compose is re-rendered so webcache switches to it; only the webcache
# service is recreated, so Traefik keeps proxying and the disk cache survives.

- hosts: slingslop
  gather_facts: true
  become: true

  tasks:
    - name: Re-render edge compose with the target webcache_image
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/traefik/templates/compose.edge.yml.j2"
        dest: "{{ slingslop_root }}/compose.edge.yml"
        owner: root
        group: root
        mode: "0640"

    # Render the bind-mounted vhost configs from the single source of truth.
    # This also seeds any *new* config file (e.g. a newly added vhost) before
    # `dc up`, so Docker never finds a missing bind source and auto-creates a
    # directory in its place. The role's "restart webcache" handler is flushed
    # explicitly below, before the image swap.
    - name: Render webcache vhost configs (roles/webcache = source of truth)
      ansible.builtin.import_role:
        name: webcache

    - name: Pull webcache image
      ansible.builtin.command:
        cmd: "{{ slingslop_root }}/dc pull webcache"
      register: pull_result
      changed_when: "'Downloaded newer image' in pull_result.stdout or 'Pull complete' in pull_result.stdout"

    - name: Apply any config-change recreate now (before the image swap)
      ansible.builtin.meta: flush_handlers

    - name: Recreate webcache container (no-deps)
      ansible.builtin.command:
        cmd: "{{ slingslop_root }}/dc up -d --no-deps webcache"
      register: up_result
      changed_when: "'Started' in up_result.stderr or 'Recreated' in up_result.stderr or 'Created' in up_result.stderr"

    - name: Verify webcache responds inside the network
      # Only confirms the container/Apache process came back up after the
      # swap. Without a matching Host header this hits whatever vhost Apache
      # treats as default (undefined/arbitrary among the generated tenants) --
      # a non-2xx from THAT vhost is still a normal, connected response, not a
      # failure of the webcache deploy itself (which doesn't own Sling content
      # or vhost precedence). Do NOT add `-f`: it would fail this check on any
      # such non-2xx, unrelated to whether webcache actually came back up.
      ansible.builtin.command:
        cmd: docker exec slingslop-webcache curl -s -o /dev/null -w '%{http_code}\n' http://127.0.0.1/
      register: probe
      retries: 20
      delay: 3
      until: probe.rc == 0
      changed_when: false
