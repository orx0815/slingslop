---
# GitOps edge-config deploy. Ships the reverse-proxy + Sling short-URL mapping
# for the CURRENT tenant list to the running host, WITHOUT swapping any image or
# recreating Traefik. This is the deploy triggered when a CONGA environment (the
# tenant list) changes — e.g. Agent Smith adds a tenant (Task 13 in
# docs/agent-skills/create-Sling-app-with-Agent_Smith.md).
#
#   ansible-playbook -i inventory/hosts.yml playbooks/deploy-tenant-edge.yml --ask-vault-pass
#
# Prerequisite (CI does this before running): generate the CONGA config on the
# control node so it exists under
# devops/conga/target/configuration/{{ conga_env }}/{{ conga_node }}/ :
#
#   mvn -pl launcher/launcher-dependencies,devops/conga -am -DskipTests \
#       -Ddocker.skip=true clean package
#
# What lands where:
#   * webcache/<app>.conf            → bind-mounted vhosts (webcache restarts, image unchanged)
#   * traefik/dynamic/router-<app>.yml → file-provider routers (Traefik hot-reloads)
#   * /etc/map host mappings          → installed into the RUNNING Sling (Composum pkg mgr)
#
# The Sling image is NOT rebuilt: adding a tenant that points an existing app at a
# different content root needs only these three config artifacts.

- hosts: slingslop
  gather_facts: true
  become: true

  tasks:
    - name: Ship CONGA webcache vhosts (config only; webcache restarts, image unchanged)
      ansible.builtin.import_role:
        name: webcache

    - name: Ship CONGA per-app Traefik routers (file provider hot-reloads)
      ansible.builtin.import_role:
        name: traefik
        tasks_from: ship-routers

    - name: Install the CONGA /etc/map short-URL mappings into the running Sling
      ansible.builtin.import_role:
        name: slingslop
        tasks_from: install-mappings
