# local-bench — DEVELOPER benchmark / cross-check environment.
#
# Renders the SAME tenant through all THREE webcache variants (one node each) so
# the generated apache / nginx / varnish configs can be diffed and run
# side-by-side. Consumed by docker/webcache-bench/docker-compose.yml, which
# bind-mounts each node's webcache/ dir into the matching engine image and
# points all three at your dev Sling on the host (:8080).
#
# Single tenant on purpose: Varnish loads ONE vcl per instance, so a per-tenant
# `<app>.vcl` is a complete single-host config. sling-matrix matches the content
# your local dev Sling already serves.

config:
  # Host header the vhosts expect; the bench sends `-host www.motorbrot.local`.
  domain: motorbrot.local

nodes:

- node: apache
  roles:
  - role: slingslop-webcache
    variant: apache

- node: nginx
  roles:
  - role: slingslop-webcache
    variant: nginx

- node: varnish
  roles:
  - role: slingslop-webcache
    variant: varnish

tenants:

- tenant: sling-matrix
  roles:
  - public-cached
  config:
    contentRoot: /content/sling-matrix
    appsRoot: /apps/sling-matrix
    subdomain: www
    serverAliases:
    - "${domain}"
