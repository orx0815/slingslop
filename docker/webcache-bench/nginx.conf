# Minimal nginx base for the webcache bench. Provides the http{} scaffolding and
# includes the CONGA-generated per-app server block(s) from conf.d/. The
# generated file is self-contained (it declares its own proxy_cache_path + all
# filtering inline), so no shared map{} blocks are needed here.
worker_processes auto;
error_log /dev/stderr warn;
events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile on;
    tcp_nopush on;
    server_tokens off;
    keepalive_timeout 65;

    log_format cache '$remote_addr $status $upstream_cache_status "$request"';
    access_log /dev/stdout cache;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # CONGA-generated <app>.nginx.conf files are bind-mounted here.
    include /etc/nginx/conf.d/*.conf;
}
