name: Publish Docker Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to publish"
        required: true
        default: "snapshot"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base + composite image with Maven plugin
        # Full-reactor build (NOT -pl launcher -am): the launcher resolves the
        # content packages via plugin GAV, not as Maven <dependency>, so -am
        # would bake stale content packages from the restored ~/.m2 cache.
        run: mvn -U clean install -DskipITs -Pcomposite-image -Ddocker.skip=false -Ddocker.skip.push=false -Ddocker.image.tag=${{ github.event.inputs.image_tag }} -Ddocker.image.extra.tag=sha-${{ github.sha }}

      # seed_and_bake.sh (composite-image profile) builds the composite image
      # locally but does not push it, so push it explicitly here.
      - name: Push composite image
        run: |
          docker tag ghcr.io/orx0815/slingslop:${{ github.event.inputs.image_tag }}-composite ghcr.io/orx0815/slingslop:sha-${{ github.sha }}-composite
          docker push ghcr.io/orx0815/slingslop:${{ github.event.inputs.image_tag }}-composite
          docker push ghcr.io/orx0815/slingslop:sha-${{ github.sha }}-composite

  publish-webcache:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push webcache image
        uses: docker/build-push-action@v6
        with:
          context: devops/webcache
          push: true
          tags: |
            ghcr.io/orx0815/slingslop-webcache:${{ github.event.inputs.image_tag }}
            ghcr.io/orx0815/slingslop-webcache:sha-${{ github.sha }}
